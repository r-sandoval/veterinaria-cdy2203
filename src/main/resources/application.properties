spring.application.name=veterinaria

# Conexión a MySQL
spring.datasource.url=jdbc:mysql://localhost:3307/veterinaria_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=vetuser
spring.datasource.password=vetpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
logging.level.com.duoc.veterinaria=DEBUG

# JWT
jwt.secret=ZnJhc2VzbGFyZ2FzcGFyYWNvbG9jYXIjb21vY2xhdmlVbnVucHJvamVjdG9kZWwtZXBsb3BhcmFqd3Rjb25zcHJpbmdzZWN1cml0eQ==
jwt.expiration=86400000

server.port=8081
# Credenciales iniciales (mover a variables de entorno en producción)
app.admin.password=${ADMIN_PASSWORD:admin123}
app.user.password=${USER_PASSWORD:user123}
app.jwt.secret=${JWT_SECRET:ZnJhc2VzbGFyZ2FzcGFyYWNvbG9jYXIjb21vY2xhdmlVbnVucHJvamVjdG9kZWwtZXBsb3BhcmFqd3Rjb25zcHJpbmdzZWN1cml0eQ==bWlwcnVlYmFkZWVqbXBsb3BhcmFjYXNIjQ=}
