version: '3.8'
services:
  mysql-db:
    image: mysql:8.0
    container_name: veterinaria-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: veterinaria_db
      MYSQL_USER: vetuser
      MYSQL_PASSWORD: vetpassword
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - vet-network

volumes:
  mysql_data:

networks:
  vet-network:
    driver: bridge